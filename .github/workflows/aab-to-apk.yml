name: Drive orqali AAB dan APK yasash

on:
  workflow_dispatch: # Tugma orqali ishga tushirish

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bundletool yuklash
        run: wget https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar -O bundletool.jar

      - name: AAB faylni Drive'dan tortib olish
        run: |
          # Bu yerda sizning Drive ID ishlatilgan
          FILE_ID="1D8E8eY8ZjM-qE_ZZC_R9c570COx2RfWN"
          wget --no-check-certificate 'https://docs.google.com/uc?export=download&id='${FILE_ID} -O my_app.aab

      - name: APK yaratish (Universal)
        run: |
          java -jar bundletool.jar build-apks \
            --bundle="my_app.aab" \
            --output="my_app.apks" \
            --mode=universal

      - name: APK ni ajratib olish
        run: |
          unzip my_app.apks -d apks_dir
          mv apks_dir/universal.apk ./PC-OnCloud-Ready.apk

      - name: APK ni yuklab olish uchun tayyorlash
        uses: actions/upload-artifact@v4
        with:
          name: Mening-Tayyor-APK-Faylim
          path: PC-OnCloud-Ready.apk
          
